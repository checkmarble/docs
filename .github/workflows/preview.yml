name: Preview

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      openapi-ref: ${{ steps.openapi.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - id: openapi
        env:
          OPENAPI_REF: ${{ vars.OPENAPI_REF }}
        run: |
          bun run openapi:fetch
          echo "ref=$(cat openapi/.ref)" >> "$GITHUB_OUTPUT"

      - run: bun run build
        env:
          PUBLIC_KEYSTATIC_GITHUB_APP_SLUG: ${{ vars.KEYSTATIC_GITHUB_APP_SLUG }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      # The Keystatic API function (functions/) is bundled at deploy time, with its dependencies.
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: pages deploy dist --project-name=marble-docs --branch=pr-${{ github.event.pull_request.number }} --commit-hash=${{ github.event.pull_request.head.sha }}

      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            📘 **Docs preview:** ${{ steps.deploy.outputs.pages-deployment-alias-url }}

            This commit (`${{ github.event.pull_request.head.sha }}`): ${{ steps.deploy.outputs.deployment-url }}
            API reference from `checkmarble/marble-backend@${{ needs.build.outputs.openapi-ref }}`.
